name: Test and build Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Desktop test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth dbus-x11 libxcb-cursor0 libxkbcommon-x11-0

      - name: Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Test isolated media sessions and Qt rendering
        run: dbus-run-session --config-file tests/dbus-session.conf -- xvfb-run -a .venv/bin/python -m pytest -q

      - name: Stamp tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: .venv/bin/python tools/set_version.py "${RELEASE_TAG#v}"

      - name: Build portable Linux app
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: VerseFlow-linux-x86_64
          path: dist/VerseFlow-linux-*.tar.gz

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/VerseFlow-linux-*.tar.gz
