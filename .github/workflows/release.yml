name: Test and build Linux locally

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v-prefixed tag to build and upload (leave empty to test main)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: verseflow-local-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64, verseflow]
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Check local build dependencies
        run: |
          command -v python3 gh dbus-run-session xvfb-run
          python3 -c 'import sys; assert sys.version_info >= (3, 10), "Python 3.10+ is required"'
          if [[ -n "$RELEASE_TAG" && ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo 'Use a release tag such as v1.1.0.' >&2
            exit 1
          fi

      - name: Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Test isolated media sessions and Qt rendering
        run: dbus-run-session --config-file tests/dbus-session.conf -- xvfb-run -a .venv/bin/python -m pytest -q

      - name: Stamp tagged release
        if: env.RELEASE_TAG != ''
        run: .venv/bin/python tools/set_version.py "${RELEASE_TAG#v}"

      - name: Build portable Linux app
        run: ./build.sh

      # Builds run on this PC and upload directly to Releases.
      # No GitHub-hosted runner minutes or Actions artifact/cache storage are used.
      - name: Publish GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="dist/VerseFlow-linux-$(uname -m)-${RELEASE_TAG#v}.tar.gz"
          test -f "$archive"
          if ! gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes -R "$GITHUB_REPOSITORY"
          fi
          gh release upload "$RELEASE_TAG" "$archive" --clobber -R "$GITHUB_REPOSITORY"
